name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Unit tests + extension check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Background service worker against a fake chrome.* API (test/fake-chrome.js),
      # plus tests for the checker below.
      - name: Unit tests
        run: npm test

      # Manifest V3 sanity, every referenced file and icon exists, no inline or
      # remote scripts, JS syntax, permissions on the allowlist.
      - name: Manifest and file check
        run: npm run check

      - name: Check manifest version is bumped vs main (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          BASE_VERSION=$(git show origin/main:src/manifest.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "0.0.0")
          PR_VERSION=$(node -p "require('./src/manifest.json').version")
          echo "main: $BASE_VERSION  →  PR: $PR_VERSION"
          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "::warning::manifest.json version unchanged ($PR_VERSION). Bump it before tagging a release."
          fi
